<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>3D Pixel Dice Component</title>
  <style>
    @font-face {
      font-family: 'DungGeunMo';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --border-color: rgba(74, 62, 61, 0.15); /* Very subtle soft border */
      --pip-color-default: #3d2a23; /* Dark chocolate wood-burnt pips (fixed) */
      --shadow-color: rgba(74, 62, 61, 0.12); /* Soft warm shadow for bevel */
      --core-bg: #cba88e; /* Muted darker wood tone to block gaps and act as inner shadow */
    }

    body {
      margin: 0;
      padding: 0;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      width: 100%;
      font-family: 'DungGeunMo', monospace;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 15px 10px;
      width: 100%;
      height: 100%; /* Stretch to occupy the fixed height of dice-box */
      box-sizing: border-box;
    }

    /* Cozy White Gamebox Card for the rolling dice area - fixed size equivalent to 6 dice (2 rows) */
    .dice-box {
      background: #ffffff;
      border: 2px solid rgba(74, 62, 61, 0.18);
      box-shadow: 0 12px 30px rgba(74, 62, 61, 0.06), inset -4px -4px 0px #f5ede0;
      border-radius: 20px;
      padding: 10px;
      width: 95%;
      max-width: 580px;
      height: 310px; /* Locked to 6-dice (2 rows) height to avoid shifting */
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 40px auto 10px auto; /* 40px top margin leaves safe headroom for floating results */
      box-sizing: border-box;
      position: relative;
    }

    /* 3D Dice Scene wrapper */
    .dice-scene {
      width: 130px;
      height: 130px;
      perspective: 600px;
      display: inline-block;
      cursor: pointer;
      position: relative;
    }

    /* Dice Container */
    .dice {
      width: 100px;
      height: 100px;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg);
      transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.3, 1.05);
    }

    /* Volumetric Core to fill corner gaps */
    .dice-core {
      position: absolute;
      width: 96px;
      height: 96px;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      top: 2px;
      left: 2px;
      backface-visibility: visible;
    }
    .core-x { transform: rotateY(90deg) translateZ(0px); }
    .core-y { transform: rotateX(90deg) translateZ(0px); }
    .core-z { transform: translateZ(0px); }

    /* Volumetric Rounded Face Setup */
    .face {
      position: absolute;
      width: 100px;
      height: 100px;
      background: #dfc2ab;
      border: 1px solid var(--border-color); /* Muted border */
      border-radius: 28px; /* Heavily rounded corners */
      /* Volumetric bevel lighting */
      box-shadow: inset -6px -6px 12px var(--shadow-color), 
                  inset 6px 6px 12px rgba(255, 255, 255, 0.55),
                  3px 3px 8px rgba(74, 62, 61, 0.15);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 16px;
      box-sizing: border-box;
      backface-visibility: hidden;
    }

    /* 3D Position mapping for faces */
    .face-1 { transform: translateZ(50px); }
    .face-6 { transform: rotateY(180deg) translateZ(50px); }
    .face-3 { transform: rotateY(90deg) translateZ(50px); }
    .face-4 { transform: rotateY(-90deg) translateZ(50px); }
    .face-2 { transform: rotateX(90deg) translateZ(50px); }
    .face-5 { transform: rotateX(-90deg) translateZ(50px); }

    /* Pips (Round & Recessed) */
    .pip {
      display: block;
      width: 14px;
      height: 14px;
      background-color: var(--pip-color-default);
      border-radius: 50%;
      margin: auto;
      box-shadow: inset 1.5px 1.5px 3px rgba(0, 0, 0, 0.45);
    }

    /* Face 1 features an iconic, cute larger center pip */
    .face-1 .pip {
      width: 20px;
      height: 20px;
      box-shadow: inset 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    /* Grid layout for face pips */
    .face-1 .pip { grid-area: 2 / 2; }

    .face-2 .pip:nth-child(1) { grid-area: 1 / 1; }
    .face-2 .pip:nth-child(2) { grid-area: 3 / 3; }

    .face-3 .pip:nth-child(1) { grid-area: 1 / 1; }
    .face-3 .pip:nth-child(2) { grid-area: 2 / 2; }
    .face-3 .pip:nth-child(3) { grid-area: 3 / 3; }

    .face-4 .pip:nth-child(1) { grid-area: 1 / 1; }
    .face-4 .pip:nth-child(2) { grid-area: 1 / 3; }
    .face-4 .pip:nth-child(3) { grid-area: 3 / 1; }
    .face-4 .pip:nth-child(4) { grid-area: 3 / 3; }

    .face-5 .pip:nth-child(1) { grid-area: 1 / 1; }
    .face-5 .pip:nth-child(2) { grid-area: 1 / 3; }
    .face-5 .pip:nth-child(3) { grid-area: 2 / 2; }
    .face-5 .pip:nth-child(4) { grid-area: 3 / 1; }
    .face-5 .pip:nth-child(5) { grid-area: 3 / 3; }

    .face-6 .pip:nth-child(1) { grid-area: 1 / 1; }
    .face-6 .pip:nth-child(2) { grid-area: 1 / 3; }
    .face-6 .pip:nth-child(3) { grid-area: 2 / 1; }
    .face-6 .pip:nth-child(4) { grid-area: 2 / 3; }
    .face-6 .pip:nth-child(5) { grid-area: 3 / 1; }
    .face-6 .pip:nth-child(6) { grid-area: 3 / 3; }

    /* Roll animation for vertical bounce */
    @keyframes roll-bounce {
      0% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-40px) scale(1, 1.05); }
      70% { transform: translateY(8px) scale(1, 0.96); }
      100% { transform: translateY(0) scale(1); }
    }

    .rolling-scene {
      animation: roll-bounce 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
    }

    /* Floating Number popup styling (RPG Style Retro Font with tactile bouncy pop) */
    @keyframes float-fade {
      0% {
        opacity: 0;
        transform: translate3d(-50%, 10px, 80px) scale(0.5);
      }
      15% {
        opacity: 1;
        transform: translate3d(-50%, -10px, 80px) scale(1.25);
      }
      30% {
        transform: translate3d(-50%, -15px, 80px) scale(1.0);
      }
      85% {
        opacity: 1;
        transform: translate3d(-50%, -25px, 80px) scale(1.0);
      }
      100% {
        opacity: 0;
        transform: translate3d(-50%, -35px, 80px) scale(0.8);
      }
    }

    .float-number {
      position: absolute;
      left: 50%;
      top: -10px; /* Positioned closer to the top edge of the dice */
      transform: translateX(-50%);
      font-size: 2.2rem;
      font-weight: 800;
      color: #455FCC; /* Sweet lavender-blue for retro contrast */
      text-shadow: 2.5px 2.5px 0px #ffffff,
                   -2.5px -2.5px 0px #ffffff,
                   2.5px -2.5px 0px #ffffff,
                   -2.5px 2.5px 0px #ffffff,
                   4px 4px 0px #4a3e3d; /* Thick white border outline + flat chocolate shadow */
      pointer-events: none;
      z-index: 100;
      animation: float-fade 1.1s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

  </style>
</head>
<body>
  <!-- Outer gamebox card is now rendered inside the iframe as a centered block -->
  <div class="dice-box">
    <div class="container" id="dice-container"></div>
  </div>

  <script>
    // Standard rotation angles to display each face facing the camera
    const rotations = {
      1: { x: 0, y: 0 },
      6: { x: 0, y: 180 },
      3: { x: 0, y: 270 },
      4: { x: 0, y: 90 },
      2: { x: 270, y: 0 },
      5: { x: 90, y: 0 }
    };

    // Default isometric tilt for a persistent 3D look (adjusted to show the front face more directly for better readability while maintaining the 3D structure)
    const tiltX = -15;
    const tiltY = 18;
    const tiltZ = 3;

    let cumulativeRotations = [];
    let isRolling = false;
    let diceColors = []; // Configured dynamically via Streamlit args
    let lastRollValues = null;

    // Synthesize realistic wooden roll sound effect using Web Audio API
    function playRollSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const now = audioCtx.currentTime;
        const numClicks = 5 + Math.floor(Math.random() * 3);
        
        for (let i = 0; i < numClicks; i++) {
          const timeOffset = (i / numClicks) * 0.8 + Math.random() * 0.08;
          scheduleWoodThud(audioCtx, now + timeOffset, 0.5, 210 + Math.random() * 50, 0.04);
        }

        // Landing thuds
        const landingTime = now + 0.95;
        scheduleWoodThud(audioCtx, landingTime, 1.2, 140 + Math.random() * 15, 0.09);
        scheduleWoodThud(audioCtx, landingTime + 0.12, 0.45, 175 + Math.random() * 25, 0.05);

      } catch (e) {
        console.log("Web Audio API not supported: ", e);
      }
    }

    // Schedules a single thud synthesis event
    function scheduleWoodThud(audioCtx, time, volumeScale, frequency, decayTime) {
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(frequency, time);
      osc.frequency.exponentialRampToValueAtTime(frequency * 0.72, time + decayTime);

      const baseVolume = 0.65; // Increased roll sound volume
      const volume = baseVolume * volumeScale;
      gainNode.gain.setValueAtTime(0, time);
      gainNode.gain.linearRampToValueAtTime(volume, time + 0.002);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, time + decayTime);

      osc.start(time);
      osc.stop(time + decayTime + 0.05);
    }

    // Creates the floating pixel text popup above the dice scene
    function showFloatingNumber(sceneElement, value, color) {
      const numDiv = document.createElement('div');
      numDiv.className = 'float-number';
      numDiv.innerText = value;
      if (color) {
        numDiv.style.color = color;
      }
      sceneElement.appendChild(numDiv);
      
      numDiv.addEventListener('animationend', () => {
        numDiv.remove();
      });
    }

    // Setup dice elements in the container
    function setupDice(numDice, currentValues = null) {
      const container = document.getElementById('dice-container');
      const currentCount = container.children.length;

      if (currentCount === numDice) {
        if (currentValues && !isRolling) {
          for (let i = 0; i < numDice; i++) {
            const val = currentValues[i] || 1;
            const dice = container.children[i].querySelector('.dice');
            dice.style.transition = 'none'; // Instant update
            const target = rotations[val];
            dice.style.transform = `rotateX(${target.x + tiltX}deg) rotateY(${target.y + tiltY}deg) rotateZ(${tiltZ}deg)`;
            
            setTimeout(() => {
              dice.style.transition = 'transform 1.2s cubic-bezier(0.2, 0.8, 0.3, 1.05)';
            }, 50);

            cumulativeRotations[i] = { x: target.x + tiltX, y: target.y + tiltY, z: tiltZ };
          }
        }
        return;
      }

      container.innerHTML = '';
      cumulativeRotations = [];

      for (let i = 0; i < numDice; i++) {
        cumulativeRotations.push({ x: 0, y: 0, z: 0 });

        const colors = (diceColors && diceColors[i]) ? diceColors[i] : { bg: "#dfc2ab", core: "#cba88e" };
        const scene = document.createElement('div');
        scene.className = 'dice-scene';
        scene.id = `scene-${i}`;
        scene.onclick = () => {
          if (!isRolling) {
            rollAll();
          }
        };

        scene.innerHTML = `
          <div class="dice" id="dice-${i}">
            <div class="dice-core core-x" style="background-color: ${colors.core};"></div>
            <div class="dice-core core-y" style="background-color: ${colors.core};"></div>
            <div class="dice-core core-z" style="background-color: ${colors.core};"></div>
            
            <!-- Faces -->
            <div class="face face-1" style="background-color: ${colors.bg};"><div class="pip"></div></div>
            <div class="face face-2" style="background-color: ${colors.bg};"><div class="pip"></div><div class="pip"></div></div>
            <div class="face face-3" style="background-color: ${colors.bg};"><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
            <div class="face face-4" style="background-color: ${colors.bg};"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
            <div class="face face-5" style="background-color: ${colors.bg};"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
            <div class="face face-6" style="background-color: ${colors.bg};"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
          </div>
        `;
        container.appendChild(scene);

        const dice = scene.querySelector('.dice');
        const val = (currentValues && currentValues[i]) ? currentValues[i] : 1;
        const target = rotations[val];
        dice.style.transform = `rotateX(${target.x + tiltX}deg) rotateY(${target.y + tiltY}deg) rotateZ(${tiltZ}deg)`;
        cumulativeRotations[i] = { x: target.x + tiltX, y: target.y + tiltY, z: tiltZ };
      }
    }

    // Roll all dice
    function rollAll() {
      if (isRolling) return;
      isRolling = true;

      // Play sound
      playRollSound();

      const container = document.getElementById('dice-container');
      const scenes = container.querySelectorAll('.dice-scene');
      const numDice = scenes.length;
      const newValues = [];

      for (let i = 0; i < numDice; i++) {
        const scene = scenes[i];
        const dice = scene.querySelector('.dice');
        const value = Math.floor(Math.random() * 6) + 1;
        newValues.push(value);

        scene.classList.remove('rolling-scene');
        void scene.offsetWidth;
        scene.classList.add('rolling-scene');

        const target = rotations[value];
        const current = cumulativeRotations[i];

        const spinsX = 3 + Math.floor(Math.random() * 2);
        const spinsY = 3 + Math.floor(Math.random() * 2);
        const spinsZ = 3 + Math.floor(Math.random() * 2);

        const minX = current.x + spinsX * 360;
        const kX = Math.ceil((minX - (target.x + tiltX)) / 360);
        const nextX = kX * 360 + target.x + tiltX;

        const minY = current.y + spinsY * 360;
        const kY = Math.ceil((minY - (target.y + tiltY)) / 360);
        const nextY = kY * 360 + target.y + tiltY;

        const minZ = current.z + spinsZ * 360;
        const kZ = Math.ceil(minZ / 360);
        const nextZ = kZ * 360 + tiltZ;

        cumulativeRotations[i] = { x: nextX, y: nextY, z: nextZ };
        dice.style.transform = `rotateX(${nextX}deg) rotateY(${nextY}deg) rotateZ(${nextZ}deg)`;
      }

      // Sync end of animation back to Streamlit
      setTimeout(() => {
        scenes.forEach(scene => scene.classList.remove('rolling-scene'));
        isRolling = false;

        // Show floating numbers above each dice at landing
        for (let i = 0; i < numDice; i++) {
          const colors = (diceColors && diceColors[i]) ? diceColors[i] : { bg: "#dfc2ab" };
          showFloatingNumber(scenes[i], newValues[i], colors.bg);
        }

        // Send roll results back to Streamlit parent (still active as secondary handler)
        window.parent.postMessage({
          isStreamlitMessage: true,
          type: "streamlit:setComponentValue",
          value: {
            results: newValues,
            roll_id: Math.random().toString(36).substr(2, 9)
          }
        }, "*");
      }, 1200);
    }

    // Handle messages from Streamlit Python (Bidirectional API)
    window.addEventListener("message", function(event) {
      if (event.data.type === "streamlit:render") {
        const args = event.data.args;
        if (args) {
          if (args.dice_colors) {
            diceColors = args.dice_colors;
          }
          if (args.num_dice !== undefined) {
            setupDice(args.num_dice, args.current_values || null);
          }
        }
      }
    });

    // Notify Streamlit that the component is loaded and ready
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:componentReady",
      apiVersion: 1
    }, "*");
  </script>
</body>
</html>
